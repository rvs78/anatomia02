name: Import RA2 Canva diagrams
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/import_ra2_canva.py
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python scripts/import_ra2_canva.py
      - name: Commit assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*.webp
          git diff --cached --quiet || (git commit -m 'assets: import RA2 original Canva slides' && git push)
